version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: agriai_postgres
    environment:
      POSTGRES_DB: agriai
      POSTGRES_USER: agriai_user
      POSTGRES_PASSWORD: agriai_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - agriai_network

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: agriai_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - agriai_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriai_backend
    environment:
      - DATABASE_URL=postgresql://agriai_user:agriai_password@postgres:5432/agriai
      - REDIS_URL=redis://redis:6379
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-default-secret-key-change-in-production}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - BHUVAN_API_KEY=${BHUVAN_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./ml-models:/app/ml-models
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - agriai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker for background tasks
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriai_celery_worker
    command: celery -A app.core.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://agriai_user:agriai_password@postgres:5432/agriai
      - REDIS_URL=redis://redis:6379
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - BHUVAN_API_KEY=${BHUVAN_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./ml-models:/app/ml-models
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - agriai_network

  # Celery Beat for scheduled tasks
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriai_celery_beat
    command: celery -A app.core.celery beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://agriai_user:agriai_password@postgres:5432/agriai
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./ml-models:/app/ml-models
    restart: unless-stopped
    networks:
      - agriai_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: agriai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./config/ssl:/etc/nginx/ssl
      - ./uploads:/var/www/uploads
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - agriai_network

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: agriai_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - agriai_network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: agriai_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - agriai_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  agriai_network:
    driver: bridge